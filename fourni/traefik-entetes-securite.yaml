# En-têtes de sécurité posés au bord par Traefik — fourni, à appliquer tel quel
# après lecture de la partie 5 du README.
#
# Un Middleware s'intercale entre le routeur et le Service : il ne route rien,
# celui-ci ne fait qu'ajouter des en-têtes de réponse. Il vit dans votre
# namespace ; une IngressRoute le raccorde par son nom, dans la liste
# « middlewares » de sa route — sans ce raccordement, il ne s'applique à rien.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ic-campus-entetes
  labels:
    app.kubernetes.io/name: ic-web
    app.kubernetes.io/part-of: ic-campus
spec:
  headers:
    # Politique de sécurité de contenu : d'où le navigateur peut charger chaque type
    # de ressource. Les mots-clés vont entre apostrophes ('self', 'none').
    # style-src garde 'unsafe-inline' : Angular pose ses styles dans des balises <style>
    # à l'exécution, sans lui la page s'affiche sans mise en forme (incident du 4 septembre).
    # script-src ne l'a pas, et ne doit jamais l'avoir.
    contentSecurityPolicy: "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

    # HSTS : une fois vu en HTTPS, le navigateur refuse le clair sur ce domaine pendant un an.
    stsSeconds: 31536000
    stsIncludeSubdomains: true

    # nosniff : le navigateur obéit au Content-Type au lieu de deviner le type du fichier.
    # frameDeny : la page ne s'affiche pas dans un cadre d'un autre site (détournement de clic).
    # referrer : l'URL complète de la page d'origine ne fuit pas vers un site tiers.
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: "strict-origin-when-cross-origin"
