titre: IC-Campus sur Kubernetes — l'architecture cible
sous_titre: 'Trois étages, trois responsabilités : le portail sert et relaie, l''API seule lit le catalogue et détient les identifiants, le stockage seul survit à un conteneur.'
description: 'Architecture cible : Internet arrive sur Traefik, qui applique le Middleware d''en-têtes et route par IngressRoute vers ic-web (portail Angular servi par nginx, deux instances), qui relaie
  /icgroup/api/ vers ic-api (API Flask servie par gunicorn), qui lit le catalogue sur un stockage durable sauvegardé par une tâche planifiée vers un stockage d''archives ; la configuration et les valeurs
  sensibles sont injectées à l''exécution ; les images viennent du registre privé GitLab.'
